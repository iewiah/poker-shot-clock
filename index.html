<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="A simple offline poker countdown timer.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Poker Clock</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#111827; --gold:#f5c451; --muted:#9ca3af; --line:#263244; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; min-height:100dvh; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      display:flex; justify-content:center; align-items:center; background:radial-gradient(ellipse at top,#1c2b42 0,#0b1220 55%);
      color:#f9fafb; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main { width:min(100%,440px); }
    .app { background:rgba(17,24,39,.96); border:1px solid #263244; border-radius:24px; padding:22px; box-shadow:0 20px 60px #0008; }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:24px; }
    .brand { font-weight:800; letter-spacing:.12em; font-size:.9rem; display:flex; gap:10px; align-items:center; }
    .spade { color:var(--gold); font-size:1.5rem; }
    .status { font-size:.7rem; font-weight:800; letter-spacing:.08em; padding:7px 10px; border-radius:999px; background:#273449; color:#cbd5e1; }
    .status.running { color:#bbf7d0; background:#14532d; }
    .status.finished { color:#fecaca; background:#7f1d1d; }
    .clock { text-align:center; padding:28px 0 18px; }
    #display { font-variant-numeric:tabular-nums; font-size:clamp(4.5rem,19vw,6.5rem); line-height:1; font-weight:800; letter-spacing:-.055em; color:var(--gold); }
    .caption { color:var(--muted); font-size:.72rem; font-weight:700; letter-spacing:.16em; margin-top:14px; }
    .track { height:8px; background:#374151; border-radius:99px; overflow:hidden; }
    #progress { height:100%; width:100%; background:var(--gold); border-radius:99px; transition:width .2s linear; }
    .progress-label { display:flex; justify-content:space-between; color:var(--muted); font-size:.72rem; margin-top:8px; }
    .settings { margin-top:28px; }
    .section-title { font-size:.85rem; font-weight:750; margin-bottom:12px; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:block; color:#cbd5e1; font-size:.75rem; margin-bottom:7px; }
    input {
      width:100%; border:1px solid #3b485c; background:#0b1220; color:white; border-radius:12px;
      padding:13px 14px; font:inherit; font-size:1.1rem; font-variant-numeric:tabular-nums;
    }
    input:focus { outline:2px solid var(--gold); border-color:transparent; }
    .buttons { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-top:18px; }
    button {
      border:0; border-radius:12px; padding:14px 8px; font:inherit; font-weight:750; cursor:pointer;
      background:#263449; color:#f9fafb; min-height:50px;
    }
    button:active { transform:scale(.98); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    #start { background:#15803d; }
    #reset { background:#7f1d1d; }
    .presets { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .presets button { min-height:38px; padding:8px 13px; font-size:.8rem; background:#263449; }
    .footer { text-align:center; color:#94a3b8; font-size:.72rem; line-height:1.5; margin:18px 4px 2px; }
    @media (max-height:650px) { body { align-items:flex-start; } .app { padding:16px; } .clock { padding:15px 0 12px; } #display { font-size:4.2rem; } .settings { margin-top:18px; } }
  </style>
</head>
<body>
<main>
  <section class="app" aria-label="Poker countdown timer">
    <header>
      <div class="brand"><span class="spade">♠</span> POKER CLOCK</div>
      <div id="status" class="status" aria-live="polite">READY</div>
    </header>

    <div class="clock">
      <div id="display" role="timer" aria-live="off">20:00</div>
      <div class="caption">TIME REMAINING</div>
    </div>

    <div class="track" aria-hidden="true"><div id="progress"></div></div>
    <div class="progress-label"><span>COUNTDOWN</span><span id="percent">100%</span></div>

    <div class="settings">
      <div class="section-title">Set timer</div>
      <div class="fields">
        <div><label for="minutes">Minutes</label><input id="minutes" type="number" inputmode="numeric" min="0" max="99" value="20"></div>
        <div><label for="seconds">Seconds</label><input id="seconds" type="number" inputmode="numeric" min="0" max="59" value="0"></div>
      </div>
      <div class="buttons">
        <button id="start">▶ Start</button>
        <button id="pause" disabled>Ⅱ Pause</button>
        <button id="reset">↺ Reset</button>
      </div>
      <div class="section-title" style="margin-top:22px">Quick presets</div>
      <div class="presets">
        <button data-min="5">5 min</button><button data-min="10">10 min</button>
        <button data-min="15">15 min</button><button data-min="20">20 min</button>
        <button data-min="30">30 min</button><button data-min="60">60 min</button>
      </div>
    </div>
  </section>
  <p class="footer">Works offline once installed. Keep this screen open while timing a game.</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const minutesInput = $("minutes"), secondsInput = $("seconds");
  const display = $("display"), status = $("status"), progress = $("progress"), percent = $("percent");
  const startBtn = $("start"), pauseBtn = $("pause"), resetBtn = $("reset");

  let durationMs = 20 * 60 * 1000;
  let remainingMs = durationMs;
  let endAt = 0;
  let intervalId = null;
  let running = false;
  let finished = false;
  let wakeLock = null;
  let audioContext = null;

  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const readDuration = () => {
    const mins = clamp(parseInt(minutesInput.value, 10) || 0, 0, 99);
    const secs = clamp(parseInt(secondsInput.value, 10) || 0, 0, 59);
    minutesInput.value = mins;
    secondsInput.value = secs;
    return (mins * 60 + secs) * 1000;
  };
  const format = ms => {
    const totalSeconds = Math.ceil(Math.max(0, ms) / 1000);
    return `${String(Math.floor(totalSeconds / 60)).padStart(2,"0")}:${String(totalSeconds % 60).padStart(2,"0")}`;
  };
  function render() {
    display.textContent = format(remainingMs);
    const ratio = durationMs > 0 ? remainingMs / durationMs : 0;
    progress.style.width = `${clamp(ratio * 100, 0, 100)}%`;
    percent.textContent = `${Math.round(clamp(ratio * 100, 0, 100))}%`;
    status.textContent = running ? "RUNNING" : finished ? "TIME UP" : (remainingMs < durationMs ? "PAUSED" : "READY");
    status.className = `status${running ? " running" : finished ? " finished" : ""}`;
    startBtn.textContent = running ? "▶ Running" : remainingMs < durationMs && !finished ? "▶ Resume" : "▶ Start";
    startBtn.disabled = running || finished || remainingMs <= 0;
    pauseBtn.disabled = !running;
    minutesInput.disabled = secondsInput.disabled = running;
    document.title = `${format(remainingMs)} · Poker Clock`;
  }
  function beep() {
    if (!audioContext) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      audioContext = new AudioCtx();
    }
    if (audioContext.state === "suspended") audioContext.resume();
    [0, 220, 440].forEach(delay => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.connect(gain); gain.connect(audioContext.destination);
      oscillator.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, audioContext.currentTime + delay / 1000);
      gain.gain.exponentialRampToValueAtTime(0.22, audioContext.currentTime + delay / 1000 + .02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + delay / 1000 + .16);
      oscillator.start(audioContext.currentTime + delay / 1000);
      oscillator.stop(audioContext.currentTime + delay / 1000 + .18);
    });
  }
  async function requestWakeLock() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }
    catch (_) { /* Device/browser may not support screen wake lock. */ }
  }
  async function releaseWakeLock() {
    try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } }
    catch (_) {}
  }
  function stopTicker() { if (intervalId !== null) clearInterval(intervalId); intervalId = null; }
  function tick() {
    remainingMs = Math.max(0, endAt - Date.now());
    if (remainingMs <= 0) {
      remainingMs = 0; running = false; finished = true; stopTicker(); releaseWakeLock(); beep();
    }
    render();
  }
  function start() {
    if (running || finished) return;
    if (remainingMs <= 0) return;
    running = true;
    endAt = Date.now() + remainingMs;
    requestWakeLock();
    stopTicker();
    intervalId = setInterval(tick, 200);
    render();
  }
  function pause() {
    if (!running) return;
    tick();
    if (!running) return;
    running = false; stopTicker(); releaseWakeLock(); render();
  }
  function reset() {
    running = false; finished = false; stopTicker(); releaseWakeLock();
    durationMs = readDuration(); remainingMs = durationMs; render();
  }
  function changeDuration() {
    if (running) return;
    finished = false; durationMs = readDuration(); remainingMs = durationMs; render();
  }
  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", pause);
  resetBtn.addEventListener("click", reset);
  minutesInput.addEventListener("change", changeDuration);
  secondsInput.addEventListener("change", changeDuration);
  document.querySelectorAll("[data-min]").forEach(button => button.addEventListener("click", () => {
    if (running) return;
    minutesInput.value = button.dataset.min; secondsInput.value = "0"; reset();
  }));
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && running) {
      remainingMs = Math.max(0, endAt - Date.now());
      if (remainingMs <= 0) tick();
      else requestWakeLock();
      render();
    }
  });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }
  render();
})();
</script>
</body>
</html>
