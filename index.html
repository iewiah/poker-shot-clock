<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>Poker Clock</title><style>
:root{color-scheme:dark;--gold:#f4c45e;--muted:#8995a7}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#17263a,#080d17 75%);color:#f8fafc;font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}.app{width:min(100%,760px);height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:420px;margin:auto;display:flex;flex-direction:column}header{height:48px;flex:0 0 48px;display:grid;place-items:center}.brand{font-size:.76rem;font-weight:850;letter-spacing:.22em;color:#cbd5e1}.brand span{color:var(--gold);font-size:1.2rem;margin-right:8px}.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.status{color:var(--muted);font-size:.75rem;letter-spacing:.22em;font-weight:800;margin-bottom:clamp(14px,4vh,32px)}#display{font-size:clamp(6.5rem,32vw,19rem);line-height:.88;font-weight:900;letter-spacing:-.075em;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--gold);text-shadow:0 8px 55px #f4c45e22;text-align:center}body.warning{background:radial-gradient(ellipse at 50% 42%,#8f2028,#4a1019 70%,#270a10)}#display.critical{color:#ff3434;text-shadow:0 0 45px #ff242477}.sub{color:#6f7d91;font-size:.68rem;font-weight:750;letter-spacing:.28em;margin-top:clamp(18px,4vh,34px);text-align:center}.controls{display:flex;flex-direction:column;gap:12px;padding:12px 0 max(12px,env(safe-area-inset-bottom))}.resets{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:1px solid transparent;border-radius:15px;min-height:56px;padding:13px 16px;color:#f8fafc;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.35}#toggle{background:#167a48}#toggle.paused{background:#24517d}#settings-open{background:#1b2739;border-color:#34445b}.preset{background:#172235;border-color:#8e7138;color:var(--gold);min-height:44px;padding:9px 14px;font-size:.82rem}.backdrop{display:none;position:fixed;inset:0;z-index:5;background:#020611c9;backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;padding:16px}.backdrop.open{display:flex}.panel{width:min(100%,480px);background:#111a29;border:1px solid #34445b;border-radius:24px;padding:22px;max-height:90dvh;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h2{margin:0;font-size:1.08rem}#close{min-height:38px;width:38px;padding:0;border-radius:50%;background:#253247;font-size:1.2rem}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#b6c1d0;font-size:.76rem;margin-bottom:7px}input{width:100%;background:#09111e;color:white;border:1px solid #3a4b63;border-radius:12px;padding:13px;font:inherit;font-size:1.05rem}input:focus{outline:2px solid var(--gold)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions button{min-height:48px;font-size:.82rem;padding:10px}#save{background:#25364e}#add{background:#8b6827}.title{margin:24px 0 10px;font-size:.78rem;color:#c4cedb;font-weight:800}.saved{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;gap:8px}.item span{flex:1;color:#f2d48e;font-weight:750}.item button{min-height:38px;padding:8px 12px;font-size:.75rem;background:#26364d}.item .delete{background:#512b35}.hint{color:#8491a4;font-size:.72rem;line-height:1.5}@media(max-height:560px){header{height:34px;flex-basis:34px}.status{margin-bottom:8px}.sub{margin-top:8px}.track{margin-top:15px}.controls{gap:6px}button{min-height:46px}}
/* Mobile sizing: keep the clock dominant without clipping in either orientation. */
@media(max-width:768px) and (orientation:portrait){
  #display{font-size:min(27vw,16vh);letter-spacing:-.075em}
}
@media(max-width:900px) and (orientation:landscape){
  header{height:30px;flex-basis:30px}
  .status{margin-bottom:6px}
  .sub{margin-top:6px}
  .controls{gap:6px;padding-top:6px}
  #display{font-size:min(22vw,42vh);letter-spacing:-.075em}

</style></head><body><main class="app"><header><div class="brand"><span>♠</span> POKER CLOCK</div></header><section class="stage"><div id="status" class="status">READY</div><div id="display">20:00</div><div class="sub">TIME REMAINING</div></section><section class="controls"><div id="resets" class="resets"></div><div class="row"><button id="toggle">▶ Start</button><button id="settings-open">⚙ Settings</button></div></section></main>
<div id="modal" class="backdrop" role="dialog" aria-modal="true"><section class="panel"><div class="head"><h2>Timer settings</h2><button id="close">×</button></div><div class="fields"><div><label for="minutes">Minutes</label><input id="minutes" type="number" min="0" max="99" value="0"></div><div><label for="seconds">Seconds</label><input id="seconds" type="number" min="0" max="59" value="30"></div></div><div class="actions"><button id="save">Set current timer</button><button id="add">＋ Create reset button</button></div><div class="title">YOUR RESET BUTTONS</div><div id="saved" class="saved"></div><p class="hint">Set a new duration at any time, even while the timer is running. Setting it immediately replaces the current countdown. Create named reset buttons for regular game lengths.</p></section></div>
<script>
(()=>{const $=x=>document.getElementById(x),display=$("display"),status=$("status"),toggle=$("toggle"),modal=$("modal"),mi=$("minutes"),si=$("seconds"),resets=$("resets"),saved=$("saved"),KEY="poker-clock-presets-v3";let duration=30000,remaining=duration,endAt=0,running=false,finished=false,ticker=null,wake=null,audio=null;let presets=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]").filter(p=>p&&p.ms>0&&typeof p.name==="string")}catch(e){return[]}})();const clamp=(n,a,b)=>Math.min(b,Math.max(a,n)),fmt=ms=>{let s=Math.ceil(Math.max(0,ms)/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};function read(){let m=clamp(parseInt(mi.value)||0,0,99),s=clamp(parseInt(si.value)||0,0,59);mi.value=m;si.value=s;return(m*60+s)*1000}function setInputs(ms){let s=Math.floor(ms/1000);mi.value=Math.floor(s/60);si.value=s%60}function render(){display.textContent=fmt(remaining);const secondsLeft=Math.ceil(remaining/1000);display.classList.toggle("critical",secondsLeft>0&&secondsLeft<=5);document.body.classList.toggle("warning",secondsLeft>0&&secondsLeft<=10);status.textContent=running?"RUNNING":finished?"TIME UP":remaining<duration?"PAUSED":"READY";toggle.textContent=running?"Ⅱ Pause":remaining<duration&&!finished?"▶ Resume":"▶ Start";toggle.classList.toggle("paused",!running);toggle.disabled=finished||remaining<=0;document.title=fmt(remaining)+" · Poker Clock"}function persist(){try{localStorage.setItem(KEY,JSON.stringify(presets))}catch(e){}}function renderPresets(){resets.replaceChildren();saved.replaceChildren();presets.forEach((p,i)=>{let b=document.createElement("button");b.className="preset";b.textContent=p.name;b.onclick=()=>apply(p);resets.append(b);let row=document.createElement("div");row.className="item";let label=document.createElement("span");label.textContent=p.name+" · "+fmt(p.ms);let load=document.createElement("button");load.textContent="Load";load.onclick=()=>{apply(p);close()};let del=document.createElement("button");del.textContent="Delete";del.className="delete";del.onclick=()=>{presets.splice(i,1);persist();renderPresets()};row.append(label,load,del);saved.append(row)});if(!presets.length){let p=document.createElement("p");p.className="hint";p.textContent="No reset buttons created yet.";saved.append(p)}}function upsertCurrentPreset(ms){const name=fmt(ms),i=presets.findIndex(p=>p.ms===ms);if(i>=0)presets[i]={name,ms};else presets.unshift({name,ms});persist();renderPresets()}function stop(){if(ticker)clearInterval(ticker);ticker=null}async function lock(){try{if("wakeLock"in navigator)wake=await navigator.wakeLock.request("screen")}catch(e){}}async function unlock(){try{if(wake){await wake.release();wake=null}}catch(e){}}function beep(){let C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{if(!audio)audio=new C();if(audio.state==="suspended")audio.resume();[0,220,440].forEach(d=>{let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;let t=audio.currentTime+d/1000;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.19)})}catch(e){}}function tick(){remaining=Math.max(0,endAt-Date.now());if(!remaining){running=false;finished=true;stop();unlock();beep()}render()}function playPause(){if(running){tick();if(!running)return;running=false;stop();unlock();render()}else if(!finished&&remaining>0){running=true;endAt=Date.now()+remaining;lock();stop();ticker=setInterval(tick,200);render()}}function reset(ms){running=false;finished=false;stop();unlock();duration=remaining=ms;setInputs(ms);render()}function apply(p){reset(p.ms)}function close(){modal.classList.remove("open")}$("toggle").onclick=playPause;$("settings-open").onclick=()=>modal.classList.add("open");$("close").onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});$("save").onclick=()=>{let ms=read();if(!ms){alert("Enter a duration greater than zero.");return}reset(ms);upsertCurrentPreset(ms);close()};$("add").onclick=()=>{let ms=read();if(!ms){alert("Enter a duration greater than zero.");return}let name=prompt("Name this reset button:",fmt(ms));if(name===null)return;presets.push({name:name.trim().slice(0,20)||fmt(ms),ms});persist();renderPresets()};document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&running){remaining=Math.max(0,endAt-Date.now());if(remaining<=0)tick();else lock();render()}});if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));renderPresets();render()})();
</script></body></html>
